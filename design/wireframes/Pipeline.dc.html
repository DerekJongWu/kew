<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kew — Pipeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#1c1917;background:#fff}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
.nav{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:#1c1917;text-decoration:none;font-size:14px;min-height:20px}
.nav:hover{background:#e7e5e4;color:#1c1917}
.nav.on{background:#e7e5e4;font-weight:600}
.count{font-size:12px;color:#57534e}
.btn{font:inherit;font-size:13px;padding:6px 12px;border:1px solid #d6d3d1;background:#fff;border-radius:6px;color:#1c1917;cursor:pointer;min-height:32px}
.btn.primary{background:#1c1917;color:#fff;border-color:#1c1917}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:#f5f5f4;border:1px solid #e7e5e4;color:#44403c}
.muted{color:#57534e;font-size:13px}
.col{flex:0 0 240px;background:#f5f5f4;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card{display:block;background:#fff;border:1px solid #e7e5e4;border-radius:8px;padding:12px;text-decoration:none;color:#1c1917}
.card:hover{border-color:#a8a29e;color:#1c1917}
.tab{font:inherit;font-size:13px;padding:6px 12px;border:none;background:none;border-radius:6px;cursor:pointer;color:#57534e;min-height:32px}
.tab.on{background:#f5f5f4;color:#1c1917;font-weight:600}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 800px; width: 100%;">
  <nav style="flex: 1 1 200px; max-width: 240px; background: #f5f5f4; border-right: 1px solid #e7e5e4; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box;">
    <div style="font-weight: 700; font-size: 18px; padding: 4px 10px 12px;">Kew</div>
    <button class="btn" style="text-align: left; color: #57534e; margin-bottom: 12px;">Search or jump…  ⌘K</button>
    <a class="nav" href="Main.dc.html">Today <span class="count">9</span></a>
    <a class="nav on" href="Pipeline.dc.html">Pipeline <span class="count">14</span></a>
    <a class="nav" href="Company.dc.html">Companies</a>
    <a class="nav" href="Person.dc.html">People</a>
    <a class="nav" href="Pipeline.dc.html">Meetings</a>
    <a class="nav" href="Pipeline.dc.html">Themes</a>
    <a class="nav" href="Pipeline.dc.html">Research</a>
    <div style="flex: 1;"></div>
    <a class="nav" href="Fields.dc.html">Settings</a>
    <div class="muted" style="padding: 8px 10px; font-size: 12px;">All changes saved on this Mac</div>
  </nav>
  <main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">
    <header style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px;">
      <div>
        <div class="muted">Every company is one note. These columns are its pipeline status.</div>
        <h1 style="margin: 4px 0 0; font-size: 28px;">Pipeline</h1>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn">+ Add company</button>
      </div>
    </header>
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #e7e5e4; padding-bottom: 12px;">
      <div style="display: flex; gap: 4px; flex-wrap: wrap;">
        <button class="tab on">Inbound</button>
        <button class="tab">Active deals</button>
        <button class="tab">Passed</button>
        <button class="tab">All companies</button>
        <button class="tab">+ View</button>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn">Theme ▾</button>
        <button class="btn">Source ▾</button>
        <button class="btn">Board · Table</button>
      </div>
    </div>
    <div style="display: flex; gap: 12px; overflow-x: auto; align-items: flex-start; padding-bottom: 8px;">
      <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
        <section class="col">
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 2px 4px;">
            <strong style="font-size: 14px;">{{c.name}}</strong><span class="count">{{c.n}}</span>
          </div>
          <div class="muted" style="font-size: 12px; padding: 0 4px;">{{c.cat}}</div>
          <sc-for list="{{c.cards}}" as="k" hint-placeholder-count="2">
            <a class="card" href="Company.dc.html">
              <div style="font-weight: 600; font-size: 14px;">{{k.name}}</div>
              <div class="muted" style="margin: 4px 0 8px;">{{k.line}}</div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                <span class="chip">{{k.src}}</span>
                <span class="chip">{{k.raise}}</span>
              </div>
              <div class="muted" style="font-size: 12px; margin-top: 8px;">{{k.meta}}</div>
            </a>
          </sc-for>
          <button class="btn" style="background: transparent; border-style: dashed; color: #57534e;">+ Add</button>
        </section>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>

</script>
</body>
</html>
